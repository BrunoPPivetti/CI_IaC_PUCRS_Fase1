AWSTemplateFormatVersion: "2010-09-09"
Description: "IaC-api-devops"

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

  SshAccessIp:
    Type: String
    Default: 177.131.162.222/32

  EcrRepoName:
    Type: String
    Default: projeto-devops

  AwsAccessKeyId:
    Type: String
    Description: Access Key ID 

  AwsSecretAccessKey:
    Type: String
    Description: Secret Access Key

  AwsAccountId:
    Type: String
    Description: ID da conta AWS

Resources:

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG API devops - acesso a porta 80 e 22
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshAccessIp

  ApiEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepoName
      ImageScanningConfiguration:
        ScanOnPush: true
      
  ApiEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: subnet-0263c83e0dffd9fa9
      InstanceType: t3.micro
      ImageId: ami-025ca978d4c1d9825   
      KeyName: !Ref KeyName
      SecurityGroupIds: [ !Ref ApiSecurityGroup ]
      Tags:
        - Key: Name
          Value: EC2-devops

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install docker -y
          yum install -y aws-cli
          systemctl start docker
          systemctl enable docker
          
          export AWS_ACCESS_KEY_ID="${AwsAccessKeyId}"
          export AWS_SECRET_ACCESS_KEY="${AwsSecretAccessKey}"
          
          REGION="${AWS::Region}"
          
          REPO_URL="${AwsAccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepoName}"

          aws ecr get-login-password --region $REGION \
            | docker login --username AWS --password-stdin ${AwsAccountId}.dkr.ecr.$REGION.amazonaws.com

          docker pull $REPO_URL:latest

          docker rm -f projeto-devops || true
          docker run -d \
            --name projeto-devops \
            -p 80:8000 \
            --restart always \
            $REPO_URL:latest

Outputs:
  InstancePublicIP:
    Description: IP público da instância EC2
    Value: !GetAtt ApiEC2Instance.PublicIp

  InstancePublicDNS:
    Description: DNS público da instância EC2
    Value: !GetAtt ApiEC2Instance.PublicDnsName

