AWSTemplateFormatVersion: "2010-09-09"
Description: "IaC-api-devops"

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

  SshAccessIp:
    Type: String
    Default: 0.0.0.0/0

  EcrRepoName:
    Type: String
    Default: projeto-devops

  AwsAccessKeyId:
    Type: String

  AwsSecretAccessKey:
    Type: String

  AwsSessionToken:
    Type: String

  AwsAccountId:
    Type: String
    Default: "598164936307"

Resources:

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG API devops
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshAccessIp

  ApiEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepoName
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:DescribeRepositories

  ApiEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0e86e20dae9224db8   
      KeyName: !Ref KeyName
      SecurityGroupIds: [ !Ref ApiSecurityGroup ]
      Tags:
        - Key: Name
          Value: EC2-devops

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install docker -y
          yum install -y aws-cli
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ec2-user

          export AWS_ACCESS_KEY_ID="${AwsAccessKeyId}"
          export AWS_SECRET_ACCESS_KEY="${AwsSecretAccessKey}"
          export AWS_SESSION_TOKEN="${AwsSessionToken}"

          REGION="${AWS::Region}"
          REPO_URL="${AwsAccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepoName}"

          aws ecr get-login-password --region $REGION \
            | docker login --username AWS --password-stdin ${AwsAccountId}.dkr.ecr.$REGION.amazonaws.com

          docker pull $REPO_URL:latest

          docker rm -f projeto-devops || true
          docker run -d \
            --name projeto-devops \
            -p 80:8000 \
            --restart always \
            $REPO_URL:latest

Outputs:
  InstancePublicIP:
    Value: !GetAtt ApiEC2Instance.PublicIp

  InstancePublicDNS:
    Value: !GetAtt ApiEC2Instance.PublicDnsName
